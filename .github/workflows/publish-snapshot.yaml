name: Publish Snapshot package to the Maven Central Repository
on:
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 11 and Maven Central Repository
        uses: actions/setup-java@v6
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Ensure SNAPSHOT version
        run: |
          v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          [[ "$v" == *-SNAPSHOT ]] || { echo "Refusing to publish non-SNAPSHOT version $v"; exit 1; }
      - name: Publish package
        run: mvn -B deploy -Pdeploy -Dgpg.keyname=${{ secrets.GPG_KEY_ID }} -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
